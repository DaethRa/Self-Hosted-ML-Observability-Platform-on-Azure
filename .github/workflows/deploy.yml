
name: ML Observability CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python -m compileall -q src

      - name: Check required project files
        run: |
          test -f Dockerfile
          test -f requirements.txt
          test -f src/predict.py
          test -f src/drift_exporter.py
          test -f src/performance.py
          test -f prometheus/alerts.yml

      - name: Build Docker image for validation
        run: |
          docker build -t olist-api:ci .

      - name: Login to Azure Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag and push Docker image
        if: github.event_name != 'pull_request'
        env:
          ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          docker tag olist-api:ci "$ACR_SERVER/olist-api:${GITHUB_SHA}"
          docker push "$ACR_SERVER/olist-api:${GITHUB_SHA}"


  deploy:
    name: Deploy to Azure VM
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: mlops-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/mlops_deploy
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/mlops_deploy
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/mlops_deploy > /dev/null
          echo "SSH private key validated successfully"

      - name: Upload deployment script
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          scp -i ~/.ssh/mlops_deploy \
            -o StrictHostKeyChecking=yes \
            scripts/deploy.sh \
            "azureuser@${VM_HOST}:/home/azureuser/deploy.sh"

      - name: Deploy images
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          ssh -i ~/.ssh/mlops_deploy \
            -o StrictHostKeyChecking=yes \
            "azureuser@${VM_HOST}" \
            bash /home/azureuser/deploy.sh \
            "$ACR_SERVER" "$GITHUB_SHA"

