global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: 'olist_api'
    static_configs:
      - targets: ['api:8000']
  - job_name: "drift_exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["drift-exporter:8001"]
  - job_name: "node_exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]