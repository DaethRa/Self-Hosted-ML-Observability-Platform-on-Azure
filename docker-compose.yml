version: '3.8'

services:
  api:
    image: olistmlopsacreiz97zog.azurecr.io/olist-api:latest
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
    depends_on:
      - mlflow
  mlflow:
    image: python:3.13-slim
    ports:
      - "5000:5000"
    working_dir: /app
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - STORAGE_ACCOUNT_NAME=${STORAGE_ACCOUNT_NAME}
    command: >
      bash -c "pip install mlflow azure-storage-blob && 
      mlflow server 
      --backend-store-uri sqlite:///mlflow.db 
      --default-artifact-root wasbs://mlflow-artifacts@${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/ 
      --host 0.0.0.0 --port 5000 
      --workers 1 
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus